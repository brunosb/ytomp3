name: Build installer
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Download yt-dlp runtime
        shell: pwsh
        run: Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile src-tauri/bin/yt-dlp.exe
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: YToMP3-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
